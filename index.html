<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procurement Intelligence — Edenred</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{
  --red:#F72717; --red-dark:#C81E12; --red-050:#FEECEA; --magenta:#FF007D;
  --ink:#14171C; --ink-2:#2B3038; --gray-700:#4B5563; --gray-500:#6B7280;
  --gray-300:#D8DCE3; --gray-200:#E7E9EE; --gray-100:#F2F3F6; --gray-050:#F8F9FB;
  --surface:#FFFFFF; --bg:#F5F6F9;
  --success:#12805C; --success-bg:#E4F5EE;
  --warning:#B45B04; --warning-bg:#FDEEDA;
  --danger:#C81E12; --danger-bg:#FCE7E5;
  --info:#0A6E94; --info-bg:#E4F3F8;
  --radius:12px; --radius-sm:8px;
  --shadow:0 1px 2px rgba(20,23,28,.04), 0 4px 16px rgba(20,23,28,.05);
  --sidebar-w:236px;
  /* tokens fixos que não devem inverter entre temas (sidebar, avatares, hero) */
  --sidebar-bg:#14171C; --sidebar-item-hover:#22262F; --sidebar-border:#262A33;
  --sidebar-text:#FFFFFF; --sidebar-text-dim:#9AA0AE; --sidebar-text-2:#C6CAD3;
  --hero-a:#14171C; --hero-b:#20242D;
}
[data-theme="dark"]{
  /* All Black Piano — preto piano com hierarquia por superfície, não por cinza */
  --ink:#F5F5F5; --ink-2:#E3E3E3; --gray-700:#B8B8B8; --gray-500:#8C8C8C;
  --gray-300:#242424; --gray-200:#1C1C1C; --gray-100:#141414; --gray-050:#0E0E0E;
  --surface:#0D0D0D; --bg:#050505;
  --success-bg:#0F2A21; --warning-bg:#2E2109; --danger-bg:#301210; --info-bg:#0C222B;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 10px 28px rgba(0,0,0,.55);
  --sidebar-bg:#050505; --sidebar-item-hover:#141414; --sidebar-border:#1A1A1A;
  --hero-a:#0B0B0B; --hero-b:#151515;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.5;
}
.num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum";}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}

/* ---------- Shell ---------- */
.shell{display:flex; min-height:100vh;}
.sidebar{
  width:var(--sidebar-w); flex-shrink:0; background:var(--sidebar-bg); color:var(--sidebar-text);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
  border-right:1px solid var(--sidebar-border); transition:background .2s;
}
.sidebar-brand{padding:10px 12px 8px; display:flex; align-items:center; justify-content:center;}
.portal-brand{display:flex; align-items:center; justify-content:center; width:100%;}
.portal-logo-shell{position:relative; width:100%; max-width:220px; height:118px; background:#f3f3f3; border-radius:16px; overflow:hidden; box-shadow:inset 0 0 0 1px rgba(17,19,22,.02);}
.portal-logo-shell::before{content:""; position:absolute; left:-32px; top:-18px; width:176px; height:176px; border-radius:50%; background:#F72717;}
.portal-logo-word{position:absolute; left:92px; top:24px; font-size:72px; line-height:1; font-weight:900; letter-spacing:-8px; font-family:'Arial Black','Inter',sans-serif; color:#fff; white-space:nowrap;}
.portal-logo-shell.has-image{background:#f3f3f3; border-radius:16px; box-shadow:inset 0 0 0 1px rgba(17,19,22,.02); display:flex; align-items:center; justify-content:center; padding:10px;}
.portal-logo-shell.has-image::before{display:none;}
.portal-logo-image{display:block; width:100%; height:100%; object-fit:contain; object-position:center center; position:relative; z-index:1; margin:0 auto;}
.sidebar-nav{padding:6px 12px; flex:1;}
.nav-group-label{font-size:11px; color:#6C7280; padding:16px 10px 6px; font-weight:600;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; color:#C6CAD3;
  font-size:13.5px; font-weight:500; margin-bottom:2px; cursor:pointer; transition:background .12s;
}
.nav-item:hover{background:var(--sidebar-item-hover); color:#fff;}
.nav-item.active{background:var(--sidebar-item-hover); color:#fff; position:relative;}
.nav-item.active::before{content:""; position:absolute; left:-12px; top:8px; bottom:8px; width:3px; background:var(--red); border-radius:2px;}
.nav-ico{width:17px; text-align:center; opacity:.9; font-size:14px;}
.nav-badge{margin-left:auto; font-size:10px; background:#33384333; color:#9AA0AE; padding:1px 6px; border-radius:20px;}
.sidebar-foot{padding:14px 20px 18px; border-top:1px solid var(--sidebar-border); font-size:11.5px; color:var(--sidebar-text-dim);}
.sidebar-foot b{color:#C6CAD3;}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  position:sticky; top:0; z-index:5; background:var(--surface); border-bottom:1px solid var(--gray-200);
  padding:14px 28px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
}
.topbar-left h1{font-size:18px; margin:0; font-weight:700;}
.topbar-left .sub{font-size:12.5px; color:var(--gray-500); margin-top:2px;}
.topbar-left{position:absolute; left:50%; transform:translateX(-50%); text-align:center; white-space:nowrap;}
.topbar-left>div{justify-content:center;}
.topbar-right{display:flex; align-items:center; gap:10px;}
.select{
  background:var(--gray-050); border:1px solid var(--gray-200); border-radius:8px; padding:7px 10px;
  font-size:12.5px; color:var(--ink-2); font-family:inherit; font-weight:500;
}
.icon-btn{width:32px; height:32px; border-radius:8px; border:1px solid var(--gray-200); background:var(--surface); display:flex; align-items:center; justify-content:center; font-size:14px;}
.theme-toggle{transition:background .2s, color .2s, border-color .2s;}
[data-theme="dark"] .theme-toggle{background:#FFFFFF; color:#14171C; border-color:#FFFFFF;}
.mock-pill{
  display:inline-flex; align-items:center; gap:6px; background:var(--warning-bg); color:var(--warning);
  font-size:11px; font-weight:600; padding:4px 10px; border-radius:20px; border:1px solid #F0D9AE55;
}
.content{padding:24px 28px 60px; max-width:1400px; width:100%; margin:0 auto;}

/* ---------- Filters row ---------- */
.filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px;}
.filters-bar{display:flex; align-items:end; gap:10px; flex-wrap:wrap; margin-bottom:18px; padding:14px; background:var(--surface); border:1px solid var(--gray-200); border-radius:var(--radius);}
.filter-field{display:flex; flex-direction:column; gap:5px; min-width:145px; flex:1;}
.filter-field label{font-size:10.5px; font-weight:700; color:var(--gray-500); text-transform:uppercase; letter-spacing:.04em;}
.filter-field .select{width:100%;}
.icon{width:16px; height:16px; stroke-width:2; vertical-align:-3px;}
.kpi-head{display:flex; align-items:center; gap:8px; color:var(--gray-500);}
.kpi-head .icon{color:var(--red);}
.panel-head.centered,.panel-head.centered>div{justify-content:center; text-align:center; width:100%;}
.panel>.panel-title{text-align:center;}
.kraljic-legend{display:flex; flex-wrap:wrap; justify-content:center; gap:10px 18px; margin:0 0 10px; font-size:11px; color:var(--gray-500);}
.kraljic-legend span{display:inline-flex; align-items:center; gap:5px;}
.kraljic-legend i{width:8px; height:8px; border-radius:50%; display:inline-block;}
.drawer-backdrop{position:fixed; inset:0; background:rgba(10,12,16,.42); z-index:20; display:flex; justify-content:flex-end;}
.drawer{width:min(620px,100%); height:100%; overflow:auto; background:var(--surface); padding:24px; box-shadow:-12px 0 30px rgba(0,0,0,.18);}
.drawer-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:18px;}
.drawer-title{font-size:18px; font-weight:800;}
.drawer-close{border:1px solid var(--gray-200); background:var(--surface); border-radius:8px; width:32px; height:32px; display:grid; place-items:center;}
.assessment-grid{display:grid; grid-template-columns:1fr 110px; gap:8px 12px; align-items:center;}
.assessment-grid label{font-size:12px; color:var(--gray-700);}
@media (max-width:760px){.filter-field{min-width:130px;}.drawer{padding:18px;}.kpis{grid-template-columns:1fr 1fr;}}

/* ---------- Grid / Cards ---------- */
.grid{display:grid; gap:14px;}
.kpis{grid-template-columns:repeat(6,1fr);}
.card{background:var(--surface); border:1px solid var(--gray-200); border-radius:var(--radius); box-shadow:var(--shadow);}
.kpi-card{padding:16px 16px 14px; display:flex; flex-direction:column; height:100%; justify-content:space-between; align-items:flex-start;}
.kpi-label{font-size:12px; color:var(--gray-500); font-weight:500; margin-bottom:8px;}
.kpi-value{font-size:22px; font-weight:800; letter-spacing:-.3px;}
.kpi-card .kpi-value{margin-top:2px; display:block;}
.panel{padding:18px 20px;}
.panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; flex-wrap:wrap;}
.panel-title{font-size:14.5px; font-weight:700;}
.panel-sub{font-size:12px; color:var(--gray-500); margin-top:2px;}
.seg{display:flex; background:var(--gray-100); border-radius:8px; padding:2px; gap:2px;}
.seg button{border:none; background:transparent; padding:5px 11px; border-radius:6px; font-size:12px; font-weight:600; color:var(--gray-500);}
.seg button.active{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08);}

/* ---------- Tables ---------- */
table{width:100%; border-collapse:collapse; font-size:13px;}
th{
  text-align:left; font-size:11.5px; font-weight:600; color:var(--gray-500); padding:8px 10px;
  border-bottom:1px solid var(--gray-200); cursor:pointer; user-select:none; white-space:nowrap;
}
th.sorted{color:var(--ink);}
th .arrow{font-size:9px; margin-left:3px; opacity:.6;}
td{padding:10px; border-bottom:1px solid var(--gray-100); vertical-align:middle;}
tr.clickable:hover{background:var(--gray-050); cursor:pointer;}
.tbl-wrap{overflow-x:auto;}
.name-cell{display:flex; align-items:center; gap:9px; font-weight:600;}
.avatar{width:26px; height:26px; border-radius:7px; background:var(--gray-100); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--gray-700); flex-shrink:0;}
.avatar img,.entity-avatar img,.supplier-logo-preview img{width:100%;height:100%;object-fit:contain;border-radius:inherit;}
.supplier-logo-preview{width:72px;height:72px;border-radius:12px;background:var(--gray-100);display:grid;place-items:center;color:var(--gray-500);overflow:hidden;flex-shrink:0;}
.logo-upload{display:flex;align-items:center;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--gray-200);}
.logo-upload input{font-size:12px;max-width:240px;}

.badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:3px 8px; border-radius:20px;}
.badge.green{background:var(--success-bg); color:var(--success);}
.badge.amber{background:var(--warning-bg); color:var(--warning);}
.badge.red{background:var(--danger-bg); color:var(--danger);}
.badge.blue{background:var(--info-bg); color:var(--info);}
.badge.gray{background:var(--gray-100); color:var(--gray-500);}
.dot{width:7px; height:7px; border-radius:50%; display:inline-block;}
.dot.green{background:var(--success);} .dot.amber{background:var(--warning);} .dot.red{background:var(--danger);} .dot.blue{background:var(--info);} .dot.gray{background:var(--gray-500);}

/* ---------- Layout helpers ---------- */
.row2{display:grid; grid-template-columns:2fr 1fr; gap:14px;}
.row-equal{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.stack{display:flex; flex-direction:column; gap:14px;}
.chart-box{position:relative;}
.chart-box canvas{max-height:100%;}

/* ---------- Alerts / insights ---------- */
.alert-item{display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--gray-100);}
.alert-item:last-child{border-bottom:none;}
.alert-ico{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.alert-text{font-size:12.5px; line-height:1.4;}
.alert-text b{font-weight:600;}
.alert-time{font-size:11px; color:var(--gray-500); margin-top:2px;}
.insight-item{font-size:12.5px; padding:9px 0; border-bottom:1px solid var(--gray-100); display:flex; gap:8px;}
.insight-item:last-child{border-bottom:none;}

/* ---------- Category cards (premium, sempre "black piano", independente do tema) ---------- */
.cat-card{
  position:relative; overflow:hidden; border-radius:12px; padding:22px 22px 20px; color:var(--ink);
  background:var(--surface); border:1px solid var(--gray-200); border-left:4px solid var(--cat-accent, var(--red)); cursor:pointer;
  box-shadow:var(--shadow);
  transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease, filter .2s ease;
}
.cat-card::after{
  content:""; position:absolute; right:-34px; top:-42px; width:110px; height:110px; border-radius:50%;
  background:var(--cat-accent, var(--red)); opacity:.07; pointer-events:none;
}
.cat-card.featured{border-top-color:var(--gray-200); border-right-color:var(--gray-200); border-bottom-color:var(--gray-200);}
.cat-card.featured .cat-topline{position:absolute; left:0; top:0; right:0; height:2px; background:var(--cat-accent, var(--red));}
.cat-card:hover{transform:translateY(-3px); box-shadow:0 10px 24px rgba(20,23,28,.12); border-color:var(--cat-accent, var(--red));}
.cat-card.disabled{cursor:pointer; opacity:.82;}
.cat-card.disabled:hover{transform:translateY(-2px); box-shadow:var(--shadow); border-color:var(--cat-accent, var(--red));}
.cat-icon{
  width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center;
  background:var(--gray-100); color:var(--cat-accent, var(--red)); font-size:16px; border:1px solid var(--gray-200); margin-bottom:14px;
}
.cat-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
.cat-name{font-size:16.5px; font-weight:700; letter-spacing:-.2px;}
.cat-desc{font-size:12px; color:var(--gray-500); margin-top:5px; max-width:280px; line-height:1.55;}
.cat-status-pill{font-size:10.5px; font-weight:700; padding:4px 10px; border-radius:20px; white-space:nowrap; flex-shrink:0;}
.cat-status-pill.on{background:var(--gray-100); color:var(--cat-accent, var(--red)); border:1px solid var(--gray-200);}
.cat-status-pill.off{background:rgba(255,255,255,.06); color:#9A9A9A; border:1px solid rgba(255,255,255,.08);}
.cat-metrics-primary{display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-top:22px; padding-top:18px; border-top:1px solid var(--gray-200);}
.cat-metrics-secondary{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:14px;}
.cat-metric-label{font-size:10.5px; color:var(--gray-500); font-weight:600;}
.cat-metric-value{font-size:20px; font-weight:800; margin-top:3px; letter-spacing:-.3px;}
.cat-metric-value.sm{font-size:14.5px;}
.cat-metric-value.accent{color:var(--cat-accent, var(--red));}
.cat-grid{grid-template-columns:repeat(2,1fr);}
@media (max-width:760px){ .cat-grid{grid-template-columns:1fr;} }

/* ---------- Detail header ---------- */
.detail-head{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap;}
.back-link{font-size:12.5px; color:var(--gray-500); font-weight:600; display:inline-flex; align-items:center; gap:5px; margin-bottom:10px;}
.back-link:hover{color:var(--ink);}
.entity-title{display:flex; align-items:center; gap:12px;}
.entity-avatar{width:44px; height:44px; border-radius:10px; background:var(--hero-a); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px;}
.entity-name{font-size:20px; font-weight:800;}
.entity-meta{font-size:12.5px; color:var(--gray-500); margin-top:3px;}

.score-ring{width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; position:relative;}
.score-ring .n{font-size:16px; font-weight:800;}

.mini-kpis{grid-template-columns:repeat(4,1fr);}

/* ---------- Timeline (contratos) ---------- */
.timeline-track{position:relative; height:64px; margin:26px 4px 8px;}
.timeline-line{position:absolute; top:28px; left:0; right:0; height:2px; background:var(--gray-200);}
.timeline-tick{position:absolute; top:0; transform:translateX(-50%); text-align:center; width:70px;}
.timeline-tick .lbl{font-size:10.5px; color:var(--gray-500); margin-top:36px;}
.timeline-tick .pt{width:8px; height:8px; border-radius:50%; background:var(--gray-300); margin:22px auto 0;}
.contract-dot{position:absolute; top:22px; width:10px; height:10px; border-radius:50%; transform:translate(-50%,-50%); border:2px solid var(--surface); cursor:pointer;}

/* ---------- Kraljic bubble ---------- */
.kraljic-wrap{position:relative;}
.kraljic-quad-label{position:absolute; font-size:11px; font-weight:700; color:var(--gray-300); text-transform:none;}

/* ---------- Misc ---------- */
.pill-status{font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px;}
.empty-state{padding:60px 20px; text-align:center; color:var(--gray-500);}
.empty-state .e-ico{font-size:26px; margin-bottom:8px;}
.footer-note{font-size:11.5px; color:var(--gray-500); text-align:center; padding:24px 0 8px;}
.hidden{display:none !important;}
.small-muted{font-size:11.5px; color:var(--gray-500);}
.section-title{font-size:13px; font-weight:700; margin:22px 0 10px;}
.two-col-list{display:grid; grid-template-columns:1fr 1fr; gap:8px 24px;}
.kv{display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--gray-100); font-size:12.5px;}
.kv .k{color:var(--gray-500);}
.kv .v{font-weight:600;}
.summary-kpis{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px; margin:0 0 18px;}
.summary-kpi{background:linear-gradient(180deg, var(--surface), var(--gray-050)); border:1px solid var(--gray-200); border-radius:12px; padding:12px 12px 10px; min-height:100px; display:flex; flex-direction:column; justify-content:space-between;}
.summary-kpi .label{font-size:11px; color:var(--gray-500); font-weight:600; letter-spacing:.02em; text-transform:uppercase;}
.summary-kpi .value{font-size:21px; line-height:1.1; font-weight:800; letter-spacing:-.02em; margin-top:8px; color:var(--ink);}
.summary-kpi .meta{font-size:11px; color:var(--gray-500); margin-top:3px;}
.supplier-rank-list{display:flex; flex-direction:column; gap:8px; margin-top:12px;}
.supplier-rank-item{display:grid; grid-template-columns:32px 1fr auto auto; align-items:center; gap:12px; padding:10px 12px; border:1px solid var(--gray-200); border-radius:10px; background:var(--gray-050);}
.supplier-rank-item .rank{width:28px; height:28px; border-radius:8px; display:grid; place-items:center; background:var(--red-050); color:var(--red-dark); font-size:12px; font-weight:800;}
.supplier-rank-item .name{font-weight:700; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.supplier-rank-item .share{font-size:11px; color:var(--gray-500); font-weight:600; text-align:right;}
.supplier-rank-item .value{font-weight:800; font-variant-numeric:tabular-nums; text-align:right; min-width:90px;}
.indicator-grid{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; margin-top:10px;}
.indicator-box{padding:12px 14px; border:1px solid var(--gray-200); border-radius:10px; background:linear-gradient(180deg, var(--surface), var(--gray-050));}
.indicator-box .label{display:block; font-size:11px; color:var(--gray-500); font-weight:600; margin-bottom:8px; text-transform:uppercase; letter-spacing:.02em;}
.indicator-box .value{font-size:18px; font-weight:800; letter-spacing:-.02em; color:var(--ink);}
.indicator-box .sub{font-size:11px; color:var(--gray-500); margin-top:5px;}
.project-toolbar{display:flex; align-items:end; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
.project-toolbar .filter-field{margin:0; min-width:220px; flex:1;}
.project-board{display:grid; grid-template-columns:repeat(5, minmax(190px,1fr)); gap:12px; align-items:start; overflow-x:auto; padding-bottom:4px;}
.project-lane{background:var(--gray-050); border:1px solid var(--gray-200); border-radius:12px; min-height:230px; overflow:hidden;}
.project-lane-head{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:12px 12px 10px; border-bottom:1px solid var(--gray-200); background:var(--surface);}
.project-lane-title{font-size:11px; font-weight:800; color:var(--ink-2); line-height:1.25;}
.project-lane-count{min-width:22px; height:22px; border-radius:50%; display:grid; place-items:center; background:var(--red-050); color:var(--red-dark); font-size:11px; font-weight:800;}
.project-list{display:flex; flex-direction:column; gap:8px; padding:9px;}

<script>
/* ============================================================
  DATA LAYER — fonte oficial publicada no Google Sheets
  ============================================================
   ============================================================ */
/* Polyfill defensivo: em alguns ambientes sandboxed (webviews/iframes restritos) o
   ResizeObserver nativo não existe. O Chart.js usa essa API internamente quando
   responsive:true, e sem ela a criação do gráfico lança exceção silenciosa e o
   canvas fica vazio. Este polyfill garante que os gráficos sempre renderizem. */
if(typeof window.ResizeObserver === 'undefined'){
  window.ResizeObserver = class {
    constructor(cb){ this.cb=cb; this.els=new Set(); this._last=new Map(); this._loop(); }
    observe(el){ this.els.add(el); }
    unobserve(el){ this.els.delete(el); this._last.delete(el); }
    disconnect(){ this.els.clear(); this._last.clear(); if(this._raf) cancelAnimationFrame(this._raf); }
    _loop(){
      this._raf = requestAnimationFrame(()=>{
        const entries=[];
        this.els.forEach(el=>{
          const r = el.getBoundingClientRect();
          const prev = this._last.get(el);
          if(!prev || prev.width!==r.width || prev.height!==r.height){
            this._last.set(el,{width:r.width,height:r.height});
            entries.push({target:el, contentRect:r});
          }
        });
        if(entries.length) this.cb(entries, this);
        this._loop();
      });
    }
  };
}

const DATA_SOURCE_CONFIG = {
  spreadsheetId: '2PACX-1vTmbxMEO249keBcTaC_qEMknlLLiq4VPtGacCKl7LVcqgGj4bH6ujtYlIHskGUzq8gbt3sQnS3Zt_bl',
  publishedCsvUrl: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTmbxMEO249keBcTaC_qEMknlLLiq4VPtGacCKl7LVcqgGj4bH6ujtYlIHskGUzq8gbt3sQnS3Zt_bl/pub?output=csv',
  sheetName: 'BASE_DASHBOARD',
  sheetGid: '1705110151',
  refreshIntervalMs: 5 * 60 * 1000,
  allowLocalFallback: false,
  localFallbackPath: 'data/base.json',
};

const APP_STATE = {
  hasLoaded: false,
  loading: false,
  lastSuccessfulLoad: null,
  lastError: null,
  data: [],
  records: [],
};

const TODAY = new Date();

let CATEGORIES = [];
let SUPPLIERS = [];
let CONTRACTS = [];
let PURCHASES = [];
let MONTHLY = [];
let TOTAL_SPEND = 0;
let TOTAL_SAVING = 0;
let ALERTS = [];

function addDays(d, n){ const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function fmtDate(d){ if (!d) return '--'; const date = d instanceof Date ? d : new Date(d); return date.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit', year:'numeric'}); }
function fmtMoney(v){
  const value = Number(v) || 0;
  if (Math.abs(value) >= 1000000) return 'R$ ' + (value / 1000000).toLocaleString('pt-BR', {maximumFractionDigits: 1, minimumFractionDigits: 1}) + 'M';
  if (Math.abs(value) >= 1000) return 'R$ ' + (value / 1000).toLocaleString('pt-BR', {maximumFractionDigits: 0}) + 'K';
  return 'R$ ' + value.toLocaleString('pt-BR');
}
function fmtMoneyFull(v){ const value = Number(v) || 0; return 'R$ ' + value.toLocaleString('pt-BR', {maximumFractionDigits: 0}); }
function fmtPct(v){ const value = Number(v) || 0; return value.toLocaleString('pt-BR', {maximumFractionDigits: 1}) + '%'; }
function daysBetween(a, b){ return Math.round((new Date(b) - new Date(a)) / (1000 * 60 * 60 * 24)); }
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function hexToRgba(hex, alpha){
  hex = hex.replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
  const r = parseInt(hex.slice(0, 2), 16), g = parseInt(hex.slice(2, 4), 16), b = parseInt(hex.slice(4, 6), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}
function normalizeText(value){
  return String(value ?? '').trim().replace(/\s+/g, ' ');
}
function normalizeKey(value){
  return normalizeText(value)
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}
function parseNumber(value){
  if (value === null || value === undefined || value === '') return 0;
  if (typeof value === 'number' && Number.isFinite(value)) return value;
  const str = String(value).trim();
  if (!str) return 0;
  const cleaned = str.replace(/\./g, '').replace(',', '.').replace(/[^0-9,.-]/g, '');
  const parsed = Number(cleaned);
  return Number.isFinite(parsed) ? parsed : 0;
}
function parseDate(value){
  if (!value) return null;
  const str = String(value).trim();
  if (!str) return null;
  const date = new Date(str);
  if (Number.isNaN(date.getTime())) {
    const [d, m, y] = str.split('/');
    if (d && m && y) return new Date(`${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`);
  }
  return date;
}
function slugify(value){
  return normalizeText(value || 'sem-nome').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'sem-nome';
}
function classify(s){
  const highImp = Number(s.impacto || 0) >= 3.5;
  const highCrit = Number(s.criticidade || 0) >= 3.5;
  if (highImp && highCrit) return 'Estratégico';
  if (!highImp && highCrit) return 'Gargalo';
  if (highImp && !highCrit) return 'Alavancagem';
  return 'Não crítico';
}
function classColor(c){
  return {'Estratégico': 'red', 'Gargalo': 'amber', 'Alavancagem': 'blue', 'Não crítico': 'gray'}[c];
}
function computeScore(s, w){
  w = w || {financeiro: 25, dependencia: 20, substituibilidade: 15, risco: 15, performance: 15, concentracao: 10};
  const maxSpend = Math.max(1, ...SUPPLIERS.map(x => Number(x.spend || 0)));
  const financeiro = ((Number(s.spend || 0) / maxSpend) * 100);
  const dependencia = ((Number(s.criticidade || 0) / 5) * 100);
  const substituibilidade = ((Number(s.criticidade || 0) / 5) * 100);
  const risco = ((Number(s.criticidade || 0) / 5) * 70) + ((1 - (Number(s.impacto || 0) / 5)) * 30);
  const performance = 100 - ((Number(s.criticidade || 0) * 4));
  const concentracao = ((Number(s.spend || 0) / Math.max(1, TOTAL_SPEND || 1)) * 100) * 2.2;
  const total = (financeiro * w.financeiro + dependencia * w.dependencia + substituibilidade * w.substituibilidade +
                 risco * w.risco + performance * w.performance + Math.min(100, concentracao) * w.concentracao) / 100;
  return Math.max(10, Math.min(98, Math.round(total)));
}
function riskLevel(score){
  if(score >= 55) return {label: 'Alto', color: 'red'};
  if(score >= 35) return {label: 'Atenção', color: 'amber'};
  return {label: 'Baixo risco', color: 'green'};
}
function daysToExpire(c){ return daysBetween(new Date(), c.end); }
function expireBucket(days){
  if(days < 0) return {label: 'Vencido', color: 'red'};
  if(days < 30) return {label: '< 30 dias', color: 'red'};
  if(days < 90) return {label: '30–90 dias', color: 'amber'};
  if(days < 180) return {label: '90–180 dias', color: 'blue'};
  return {label: '> 180 dias', color: 'green'};
}
function monthKey(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function monthLabel(d){ return d.toLocaleDateString('pt-BR', {month: 'short'}).replace('.', ''); }
function last12Months(){
  const arr = [];
  for (let i = 11; i >= 0; i--) {
    const d = new Date(TODAY.getFullYear(), TODAY.getMonth() - i, 1);
    arr.push(d);
  }
  return arr;
}
function buildInsights(){
  if (!SUPPLIERS.length) return ['A base ainda está sendo carregada.'];
  const topSup = [...SUPPLIERS].sort((a, b) => Number(b.spend || 0) - Number(a.spend || 0))[0];
  const expiring60 = CONTRACTS.filter(c => { const d = daysToExpire(c); return d >= 0 && d < 60; }).length;
  const avgSavingPct = TOTAL_SPEND > 0 ? (TOTAL_SAVING / TOTAL_SPEND) * 100 : 0;
  const last3 = MONTHLY.slice(-3).reduce((a, m) => a + Number(m.pct || 0), 0) / Math.max(1, MONTHLY.slice(-3).length);
  const vsAvg = avgSavingPct ? ((last3 - avgSavingPct) / avgSavingPct) * 100 : 0;
  const gargalos = SUPPLIERS.filter(s => s.status === 'Gargalo').length;
  return [
    `O fornecedor <b>${topSup.name}</b> representa ${fmtPct((Number(topSup.spend || 0) / Math.max(1, TOTAL_SPEND)) * 100)} do spend da categoria Operações.`,
    `<b>${expiring60}</b> contrato(s) vencem nos próximos 60 dias e precisam de ação de renovação ou renegociação.`,
    `O saving médio dos últimos 3 meses está ${vsAvg >= 0 ? 'acima' : 'abaixo'} da média histórica em ${fmtPct(Math.abs(vsAvg))}.`,
    `<b>${gargalos}</b> fornecedor(es) estão classificados como gargalo — alta criticidade e baixa substituição.`,
  ];
}

function chartGridColor(){
  return getComputedStyle(document.documentElement).getPropertyValue('--gray-200').trim() || '#EEF0F3';
}
function chartAxisTextColor(){

}

function getGoogleSheetUrl(){
  if (DATA_SOURCE_CONFIG.publishedCsvUrl) {
    return `${DATA_SOURCE_CONFIG.publishedCsvUrl}&gid=${encodeURIComponent(DATA_SOURCE_CONFIG.sheetGid)}&t=${Date.now()}`;
  }
  if (DATA_SOURCE_CONFIG.sheetGid) {
    return `https://docs.google.com/spreadsheets/d/${DATA_SOURCE_CONFIG.spreadsheetId}/export?format=csv&gid=${encodeURIComponent(DATA_SOURCE_CONFIG.sheetGid)}`;
  }

}

function parseCsvToRows(csvText){
  if (!csvText || !csvText.trim()) return [];
  const rows = [];
  let current = '';
  let row = [];
  let inQuotes = false;

  const pushCell = () => {
    row.push(current);
    current = '';
  };

  const pushRow = () => {
    if (row.length) {
      rows.push(row.map(value => value.replace(/\r/g, '')));
    }
    row = [];
  };

  for (let i = 0; i < csvText.length; i++) {
    const char = csvText[i];
    const next = csvText[i + 1];

    if (char === '"') {
      if (inQuotes && next === '"') {
        current += '"';
        i++;
      } else {
        inQuotes = !inQuotes;
      }
    } else if (char === ',' && !inQuotes) {
      pushCell();
    } else if ((char === '\n' || char === '\r') && !inQuotes) {
      if (char === '\r' && next === '\n') i++;
      pushCell();
      pushRow();
    } else {
      current += char;
    }
  }

  if (current || row.length) {
    pushCell();
    pushRow();
  }

  return rows.filter(line => line.some(cell => String(cell).trim() !== ''));
}

function normalizeSheetRows(rawRows){
  const aliases = {
    projeto_id: ['id projeto', 'id_projeto', 'codigo projeto', 'código projeto', 'codigo_projeto', 'project id', 'project_id'],
    fornecedor: ['fornecedor', 'supplier', 'nome fornecedor', 'fornecedores'],
    categoria: ['categoria', 'category', 'segmento'],
    tipo: ['tipo', 'type'],
    descricao: ['descricao', 'descrição', 'description'],
    proposta_inicial: ['proposta inicial', 'proposta_inicial', 'valor inicial', 'budget', 'budget inicial'],
    percentual_negociado: ['percentual negociado', 'percentual negociado %', 'percentual', 'desconto', 'percentual de desconto'],
    proposta_final: ['proposta final', 'proposta_final', 'valor final', 'valor final negociado', 'spend', 'valor final da proposta'],
    saving_cost_avoid: ['saving/cost avoid', 'saving cost avoid', 'saving / cost avoid', 'saving total', 'cost avoid', 'economia'],
    comprador: ['comprador', 'buyer', 'responsavel', 'responsável'],
    status: ['status', 'estado'],
    data: ['data', 'date', 'dt'],
    mes_conclusao: ['mes de conclusao', 'mês de conclusão', 'mes conclusao', 'mês conclusão', 'completion month'],
    unidade_negocio: ['unidade de negocio', 'unidade de negócio', 'unidade', 'business unit'],
    cnpj: ['cnpj'],
    contrato: ['contrato', 'numero contrato', 'número contrato', 'contract number'],
    vencimento: ['vencimento', 'data vencimento', 'expiration', 'due date'],
    valor_contrato: ['valor contrato', 'valor do contrato', 'contract value'],
    prazo_pagamento: ['prazo de pagamento', 'prazo pagamento', 'payment terms', 'payment days', 'dias para pagamento'],
  };

  const headerMap = {};
  const headers = Array.isArray(rawRows[0]) ? rawRows[0] : Object.keys(rawRows[0] || {});
  headers.forEach((header) => {
    const normalized = normalizeKey(header);
    const match = Object.entries(aliases).find(([, candidates]) => candidates.includes(normalized));
    headerMap[header] = match ? match[0] : normalized;
  });

  return rawRows.map((row) => {
    const normalized = {};
    Object.entries(row).forEach(([key, value]) => {
      const mappedKey = headerMap[key] || normalizeKey(key);
      normalized[mappedKey] = value;
    });

    const fornecedor = normalizeText(normalized.fornecedor || normalized.supplier || normalized.nome_fornecedor || '');
    if (!fornecedor) return null;

    const propostaInicial = parseNumber(normalized.proposta_inicial || normalized.budget || normalized.valor_inicial || 0);
    const propostaFinal = parseNumber(normalized.proposta_final || normalized.spend || normalized.valor_final || normalized.valor_final_negociado || 0);
    const saving = parseNumber(normalized.saving_cost_avoid || normalized.saving || normalized.cost_avoid || 0);
    const budget = propostaInicial || propostaFinal;
    const dateValue = parseDate(normalized.data || normalized.date || normalized.dt || '');
    const completionDate = parseDate(normalized.mes_conclusao || normalized.completion_month || '') || dateValue;
    const supplierName = fornecedor || 'Fornecedor não informado';
    const projectId = normalizeText(normalized.projeto_id || '') || `PRJ-${slugify(`${normalized.categoria || 'operacoes'}-${normalized.descricao || 'registro'}-${supplierName}`).slice(0, 28).toUpperCase()}`;

    return {
      id: projectId,
      projetoId: projectId,
      fornecedor: supplierName,
      categoria: normalizeText(normalized.categoria || 'Operações'),
      tipo: normalizeText(normalized.tipo || 'Geral'),
      descricao: normalizeText(normalized.descricao || normalized.descricao || 'Registro da base'),
      propostaInicial: budget,
      propostaFinal: propostaFinal || budget,
      saving: saving || Math.max(0, budget - (propostaFinal || budget)),
      percentualNegociado: parseNumber(normalized.percentual_negociado || normalized.percentual || 0),
      comprador: normalizeText(normalized.comprador || normalized.buyer || 'Compras'),
      status: normalizeText(normalized.status || 'Vigente'),
      data: dateValue,
      mesConclusao: completionDate,
      unidadeNegocio: normalizeText(normalized.unidade_negocio || normalized.unidade || 'Operações'),
      cnpj: normalizeText(normalized.cnpj || ''),
      contrato: normalizeText(normalized.contrato || ''),
      vencimento: parseDate(normalized.vencimento || normalized.data || ''),
      prazoPagamento: parseNumber(normalized.prazo_pagamento || normalized.payment_days || normalized.prazo || 0),
      valorContrato: parseNumber(normalized.valor_contrato || normalized.contract_value || 0),
    };
  }).filter(Boolean);
}

function transformSheetRowsToAppData(rows){
  const records = rows.length && rows[0].propostaFinal !== undefined ? rows : normalizeSheetRows(rows);
  if (!records.length) return { suppliers: [], categories: [], contracts: [], purchases: [], monthly: [], totalSpend: 0, totalSaving: 0 };
  const sourceTotalSpend = records.reduce((sum, record) => sum + Number(record.propostaFinal || record.propostaInicial || 0), 0);

  const suppliersMap = new Map();
  records.forEach((record) => {
    const key = record.fornecedor;
    const spend = Number(record.propostaFinal || record.propostaInicial || 0);
    const saving = Number(record.saving || 0);
    if (!suppliersMap.has(key)) {
      suppliersMap.set(key, {
        id: slugify(key),
        name: key,
        cnpj: record.cnpj || '',
        spend: 0,
        saving: 0,
        contracts: 0,
        paymentDays: [],
        impacto: 3,
        criticidade: 3,
        status: '',
        score: 0,
      });
    }
    const supplier = suppliersMap.get(key);
    supplier.spend += spend;
    supplier.saving += saving;
    supplier.contracts += record.contrato ? 1 : 0;
    if (record.prazoPagamento > 0) supplier.paymentDays.push(record.prazoPagamento);
  });

  const suppliers = [...suppliersMap.values()].map((supplier) => {
    const spendShare = sourceTotalSpend > 0 ? (supplier.spend / sourceTotalSpend) : 0;
    const savingShare = Math.max(0, ((supplier.saving || 0) / Math.max(1, supplier.spend || 1)) * 100);
    const criticidade = Math.max(1, Math.min(5, Math.round(2 + (spendShare * 2.5) + (savingShare > 10 ? 1 : 0))));
    const impacto = Math.max(1, Math.min(5, Math.round(2 + (savingShare > 8 ? 1.4 : 0.7) + (spendShare > 0.3 ? 0.8 : 0.2))));
    const item = { ...supplier, criticidade, impacto };
    item.paymentDays = supplier.paymentDays.length ? supplier.paymentDays.reduce((sum, days) => sum + days, 0) / supplier.paymentDays.length : 0;
    item.status = classify(item);
    item.score = computeScore(item, STATE.weights || {financeiro:25, dependencia:20, substituibilidade:15, risco:15, performance:15, concentracao:10});
    return item;
  });

  const categoryTotals = new Map();
  records.forEach((record) => {
    const key = record.categoria || 'Operações';
    if (!categoryTotals.has(key)) {
      categoryTotals.set(key, { id: slugify(key), name: key, spend: 0, saving: 0, suppliers: new Set(), contracts: 0, active: true });
    }
    const entry = categoryTotals.get(key);
    entry.spend += Number(record.propostaFinal || record.propostaInicial || 0);
    entry.saving += Number(record.saving || 0);
    entry.suppliers.add(record.fornecedor);
    if (record.contrato) entry.contracts += 1;
  });

  const categories = [...categoryTotals.values()].map((category) => ({
    id: category.id,
    name: category.name,
    color: category.name.toLowerCase().includes('tecn') ? '#0A6E94' : category.name.toLowerCase().includes('mark') ? '#FF007D' : category.name.toLowerCase().includes('rh') ? '#12805C' : '#F72717',
    active: true,
    icon: category.name.toLowerCase().includes('tec') ? 'cpu' : category.name.toLowerCase().includes('mark') ? 'megaphone' : category.name.toLowerCase().includes('rh') ? 'users' : category.name.toLowerCase().includes('fac') ? 'building' : 'settings',
    desc: 'Categoria alimentada pela base da Google Sheets.',
    spend: Number(category.spend || 0),
    saving: Number(category.saving || 0),
    suppliers: category.suppliers.size,
    contracts: Number(category.contracts || 0),
  }));

  const contracts = records.filter((record) => record.contrato || record.vencimento).map((record, index) => {
    const end = record.vencimento || addDays(new Date(), 30 + (index * 15));
    const value = Number(record.propostaFinal || record.propostaInicial || 0);
    return {
      id: record.contrato ? slugify(`${record.contrato}-${record.fornecedor}`) : `CT-${String(index + 1).padStart(3, '0')}`,
      number: record.contrato || `EDN-${String(index + 1).padStart(3, '0')}`,
      supplierId: slugify(record.fornecedor),
      category: record.categoria || 'Operações',
      start: addDays(end, -180),
      end,
      value,
      consumed: value * 0.55,
      saldo: value * 0.45,
      status: record.status || 'Vigente',
      sla: 80,
      reajuste: 'Ajuste do contrato',
      lastNegotiation: record.data || new Date(),
    };
  });

  const purchases = records.map((record, index) => ({
    id: `PC-${String(index + 1).padStart(4, '0')}`,
    date: record.mesConclusao || record.data || new Date(),
    supplierId: slugify(record.fornecedor),
    category: record.categoria || 'Operações',
    buyer: record.comprador || 'Compras',
    valueInicial: Number(record.propostaInicial || 0),
    valueFinal: Number(record.propostaFinal || record.propostaInicial || 0),
    saving: Number(record.saving || 0),
    savingPct: Number(record.propostaInicial) ? (Number(record.saving || 0) / Number(record.propostaInicial)) * 100 : 0,
    paymentDays: Number(record.prazoPagamento || 0),
    negotiationType: record.tipo || 'Não informado',
    status: record.status || 'Concluída',
    contractId: null,
  }));

  const monthMap = new Map();
  purchases.forEach((purchase) => {
    const purchaseDate = purchase.date instanceof Date ? purchase.date : new Date(purchase.date);
    if (!purchaseDate || Number.isNaN(purchaseDate.getTime())) return;
    const key = monthKey(purchaseDate);
    if (!monthMap.has(key)) {
      monthMap.set(key, { date: new Date(purchaseDate.getFullYear(), purchaseDate.getMonth(), 1), label: monthLabel(new Date(purchaseDate.getFullYear(), purchaseDate.getMonth(), 1)), spend: 0, saving: 0, pct: 0, count: 0 });
    }
    const entry = monthMap.get(key);
    entry.spend += Number(purchase.valueFinal || 0);
    entry.saving += Number(purchase.saving || 0);
    entry.count += 1;
  });

  const monthly = last12Months().map((date) => {
    const key = monthKey(date);
    const found = monthMap.get(key) || { date, label: monthLabel(date), spend: 0, saving: 0, pct: 0, count: 0 };
    const spend = Number(found.spend || 0);
    const saving = Number(found.saving || 0);
    const pct = spend > 0 ? (saving / spend) * 100 : 0;
    return { date, label: found.label || monthLabel(date), spend, saving, pct, count: found.count || 0 };
  });

  const totalSpend = records.reduce((acc, record) => acc + Number(record.propostaFinal || record.propostaInicial || 0), 0);
  const totalSaving = records.reduce((acc, record) => acc + Number(record.saving || 0), 0);

  return { suppliers, categories, contracts, purchases, monthly, totalSpend, totalSaving };
}

async function fetchGoogleSheetData(){
  const url = getGoogleSheetUrl();
  const response = await fetch(url, { cache: 'no-store' });
  if (!response.ok) {
    throw new Error(`Falha ao carregar a planilha: ${response.status} ${response.statusText}`);
  }

  const text = await response.text();
  if (!text || text.includes('Error')) {
    throw new Error('Resposta vazia ou inválida da planilha');
  }

  if (text.trim().startsWith('Fornecedor') || text.includes(',')) {
    const csvRows = parseCsvToRows(text);
    if (csvRows.length > 1) {
      const [header, ...dataRows] = csvRows;
      return dataRows.map((row) => {
        const obj = {};
        header.forEach((key, index) => {
          obj[key.trim()] = row[index] || '';
        });
        return obj;
      });
    }
  }

  const match = text.match(/\{.*\}/s);
  const payload = match ? JSON.parse(match[0]) : null;
  if (!payload || !payload.table || !Array.isArray(payload.table.rows)) {
    throw new Error('Estrutura da planilha incompatível');
  }

  const rows = payload.table.rows.map((row) => {
    const values = row.c || [];
    const object = {};
    (payload.table.cols || []).forEach((col, index) => {
      const value = values[index] && 'v' in values[index] ? values[index].v : '';
      object[col.label] = value;
    });
    return object;
  });

  return rows;
}

async function loadData(options = {}){
  const manual = Boolean(options.manual);
  if (APP_STATE.loading) return;
  APP_STATE.loading = true;
  setDataStatus('Carregando dados...', 'info');
  console.log('Carregando dados da Google Sheets...');

  try {
    let rows = [];
    if (DATA_SOURCE_CONFIG.allowLocalFallback) {
      try {
        const localResponse = await fetch(DATA_SOURCE_CONFIG.localFallbackPath, { cache: 'no-store' });
        if (localResponse.ok) {
          const localData = await localResponse.json();
          rows = Array.isArray(localData) ? localData : (localData.records || localData.data || []);
        }
      } catch (localError) {
        console.warn('Fallback local indisponível:', localError);
      }
    }

    if (!rows.length) {
      rows = await fetchGoogleSheetData();
    }

    const derived = transformSheetRowsToAppData(rows);
    if (!derived || !derived.totalSpend && !derived.totalSaving && !derived.suppliers.length) {
      throw new Error('A base não retornou dados válidos');
    }

    APP_STATE.data = rows;
    APP_STATE.records = normalizeSheetRows(rows);
    APP_STATE.hasLoaded = true;
    APP_STATE.lastSuccessfulLoad = new Date();
    APP_STATE.lastError = null;
    setDerivedData(derived);
    refreshFilteredData(false);

    setDataStatus('● Dados atualizados', 'success');
    const footer = document.getElementById('lastUpdateFooter');
    if (footer) {
      footer.textContent = `Última atualização: ${APP_STATE.lastSuccessfulLoad.toLocaleString('pt-BR', {day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'})}`;
    }
    console.log('Dados carregados:', rows.length);
    render();
  } catch (error) {
    console.error('Erro ao carregar Google Sheets:', error);
    APP_STATE.lastError = error;
    if (!APP_STATE.lastSuccessfulLoad) {
      setDataStatus('Não foi possível carregar os dados.', 'danger');
      if (document.getElementById('content')) {
        document.getElementById('content').innerHTML = `<div class="card panel"><div class="empty-state"><div class="e-ico">${icon('triangle-alert')}</div><div>Não foi possível carregar os dados da Google Sheets.</div></div></div>`;
        hydrateIcons();
      }
    } else {
      setDataStatus('Erro na atualização', 'warning');
    }
  } finally {
    APP_STATE.loading = false;
    const refreshButton = document.getElementById('refreshDataBtn');
    if (refreshButton) {
      refreshButton.disabled = false;
      refreshButton.textContent = 'Atualizar dados';
    }
  }
}

function removeLogoWhiteBackground(file, onReady){
  const reader = new FileReader();
  reader.onload = () => {
    const image = new Image();
    image.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = image.naturalWidth;
      canvas.height = image.naturalHeight;
      const context = canvas.getContext('2d', {willReadFrequently:true});
      context.drawImage(image, 0, 0);
      const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
      const pixels = imageData.data;
      const visited = new Uint8Array(canvas.width * canvas.height);
      const queue = [];
      const isWhite = index => pixels[index + 3] > 0 && pixels[index] >= 238 && pixels[index + 1] >= 238 && pixels[index + 2] >= 238 && Math.max(pixels[index], pixels[index + 1], pixels[index + 2]) - Math.min(pixels[index], pixels[index + 1], pixels[index + 2]) <= 18;
      const add = (x, y) => {
        if (x < 0 || y < 0 || x >= canvas.width || y >= canvas.height) return;
        const position = y * canvas.width + x;
        if (visited[position]) return;
        visited[position] = 1;
        const pixelIndex = position * 4;
        if (isWhite(pixelIndex)) queue.push(position);
      };
      for (let x = 0; x < canvas.width; x++) { add(x, 0); add(x, canvas.height - 1); }
      for (let y = 1; y < canvas.height - 1; y++) { add(0, y); add(canvas.width - 1, y); }
      for (let cursor = 0; cursor < queue.length; cursor++) {
        const position = queue[cursor];
        pixels[position * 4 + 3] = 0;
        const x = position % canvas.width;
        const y = Math.floor(position / canvas.width);
        add(x - 1, y); add(x + 1, y); add(x, y - 1); add(x, y + 1);
      }
      context.putImageData(imageData, 0, 0);
      onReady(canvas.toDataURL('image/png'));
    };
    image.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function getFilterRecords(){
  const filters = STATE.filters;
  const source = APP_STATE.records || [];
  return source.filter(record => {
    const processDate = record.mesConclusao || record.data;
    const month = processDate instanceof Date && !Number.isNaN(processDate.getTime()) ? String(processDate.getMonth() + 1).padStart(2, '0') : '';
    const year = processDate instanceof Date && !Number.isNaN(processDate.getTime()) ? String(processDate.getFullYear()) : '';
    if (filters.month !== 'all' && month !== filters.month) return false;
    if (filters.year !== 'all' && year !== filters.year) return false;
    if (filters.category !== 'all' && record.categoria !== filters.category) return false;
    if (filters.supplier !== 'all' && record.fornecedor !== filters.supplier) return false;
    if (filters.status !== 'all' && record.status !== filters.status) return false;
    if (filters.kraljic !== 'all') {
      const supplier = SUPPLIERS.find(item => item.name === record.fornecedor);
      if (!supplier || supplier.status !== filters.kraljic) return false;
    }
    return true;
  });
}
function setDerivedData(derived){

  TOTAL_SAVING = derived.totalSaving;
  SUPPLIERS = derived.suppliers;
  CATEGORIES = derived.categories;
  CONTRACTS = derived.contracts;
  PURCHASES = derived.purchases;
  MONTHLY = derived.monthly;
  SUPPLIERS.forEach(supplier => {
    const assessment = STATE.assessments[supplier.id];
    if (assessment) {
      supplier.impacto = Number(assessment.impacto || supplier.impacto);
      supplier.criticidade = Number(assessment.risco || supplier.criticidade);
      supplier.assessmentScore = Math.round(Object.values(assessment).reduce((sum, item)=>sum+Number(item||0),0) / Object.values(assessment).length * 20);
      supplier.status = classify(supplier);
    }
    supplier.score = computeScore(supplier, STATE.weights);
    supplier.status = classify(supplier);
  });
  ALERTS = buildAlerts();
}

function drawKraljic(canvasId){
  const ctx = document.getElementById(canvasId);
  if(!ctx) return;
  const maxSpend = Math.max(1, ...SUPPLIERS.map(s=>s.spend));
  const groups = {'Estratégico':'#DC2626','Gargalo':'#D97706','Alavancagem':'#2563EB','Não crítico':'#64748B'};
  const datasets = Object.keys(groups).map(g=>({
    label:g,
    backgroundColor: groups[g]+'CC',
    borderColor: groups[g],
    borderWidth:1,
    data: SUPPLIERS.filter(s=>s.status===g).map(s=>({x:s.impacto, y:s.criticidade, r: 8 + (s.spend/maxSpend)*22, name:s.name, spend:s.spend, saving:s.saving, savingPct:s.spend ? s.saving/s.spend*100 : 0, risk:riskLevel(s.score).label, id:s.id}))
  }));
  const key = 'k_'+canvasId;
  charts[key] = new Chart(ctx, {
    type:'bubble',
    data:{datasets},
    options:{
      responsive:true, maintainAspectRatio:false, onClick:(evt,els)=>{ if(els.length){ const d=els[0]; const pt=charts[key].data.datasets[d.datasetIndex].data[d.index]; go('fornecedores', pt.id);} },
      plugins:{
        legend:{position:'bottom', labels:{boxWidth:10, usePointStyle:true, font:{size:11}, color: chartAxisTextColor()}},
        tooltip:{callbacks:{label:(ctx)=> `${ctx.raw.name} · ${fmtMoney(ctx.raw.spend)}`, afterLabel:(ctx)=>[`Saving: ${fmtMoney(ctx.raw.saving)}`,`Saving %: ${fmtPct(ctx.raw.savingPct)}`,`Risco: ${ctx.raw.risk}`,`Classificação: ${ctx.dataset.label}`]}}
      },
      scales:{
        x:{min:0, max:6, title:{display:true, text:'Impacto financeiro', font:{size:11}, color: chartAxisTextColor()}, grid:{color: chartGridColor()}, ticks:{display:false, color: chartAxisTextColor()}},
        y:{min:0, max:6, title:{display:true, text:'Criticidade / Risco', font:{size:11}, color: chartAxisTextColor()}, grid:{color: chartGridColor()}, ticks:{display:false, color: chartAxisTextColor()}},
      }
    },
    plugins:[{id:'kraljicQuadrants',beforeDatasetsDraw(chart){
      const area=chart.chartArea; if(!area) return;
      const midX=area.left+area.width/2; const midY=area.top+area.height/2; const c=chart.ctx;
      c.save(); c.fillStyle='rgba(247,39,23,.035)'; c.fillRect(midX,area.top,area.right-midX,midY-area.top);
      c.fillStyle='rgba(180,91,4,.035)'; c.fillRect(area.left,area.top,midX-area.left,midY-area.top);
      c.fillStyle='rgba(10,110,148,.035)'; c.fillRect(midX,midY,area.right-midX,area.bottom-midY);
      c.fillStyle='rgba(138,144,160,.035)'; c.fillRect(area.left,midY,midX-area.left,area.bottom-midY);
      c.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--gray-500'); c.font='600 10px Inter';
      c.fillText('GARGALO',area.left+10,area.top+18); c.fillText('ESTRATÉGICO',midX+10,area.top+18); c.fillText('NÃO CRÍTICO',area.left+10,area.bottom-10); c.fillText('ALAVANCAGEM',midX+10,area.bottom-10); c.restore();
    }}]
  });
}

function assessmentFor(supplier){
  if(!STATE.assessments[supplier.id]) STATE.assessments[supplier.id] = {impacto:supplier.impacto,risco:supplier.criticidade,dependencia:supplier.criticidade,substituibilidade:supplier.criticidade,performance:Math.max(1,Math.min(5,6-supplier.criticidade))};

function updateAssessment(id, key, value){
  const supplier = SUPPLIERS.find(item=>item.id===id);

  const assessment = assessmentFor(supplier);
  assessment[key] = Number(value);
  supplier.impacto = assessment.impacto;
  supplier.criticidade = assessment.risco;
  supplier.assessmentScore = Math.round(Object.values(assessment).reduce((sum, item)=>sum+Number(item||0),0) / Object.values(assessment).length * 20);
  supplier.status = classify(supplier);
  supplier.score = computeScore(supplier, STATE.weights);
  render();

function drawTimeline(){
  const track = document.getElementById('timelineTrack');

  const maxD = 365;
  const pctOf = (d)=> Math.min(100, Math.max(0,(d/maxD)*100));
  let html = '<div class="timeline-line"></div>';
  marks.forEach(m=>{ html += `<div class="timeline-tick" style="left:${pctOf(m.d)}%;"><div class="pt"></div><div class="lbl">${m.label}</div></div>`; });
  CONTRACTS.forEach(ct=>{
    const d = daysToExpire(ct); const b = expireBucket(d);
    const left = pctOf(Math.max(0,Math.min(maxD,d)));
    const color = {red:'#C81E12',amber:'#B45B04',blue:'#0A6E94',green:'#12805C'}[b.color];
    html += `<div class="contract-dot" title="${ct.number} · ${fmtDate(ct.end)}" style="left:${left}%; background:${color};" onclick="go('contratos','${ct.id}')"></div>`;
  });
  track.innerHTML = html;
}

/* ---------- Compras ---------- */
function renderCompras(c){
  setHeader('Compras', '');
  const sourceRecords = Array.isArray(APP_STATE.records) ? APP_STATE.records : [];
  const isClosedStatus = status => /conclu|cancel|finaliz|encerr|fechad/i.test(String(status || ''));
  const sourceProjects = sourceRecords.filter(record => record.status && !isClosedStatus(record.status)).map(record => ({
    id: record.projetoId || record.id,
    name: record.descricao || 'Projeto sem descrição',
    category: record.categoria || 'Sem categoria',
    buyer: record.comprador || 'Não informado',
    supplier: record.fornecedor || 'Não informado',
    value: Number(record.propostaFinal || record.propostaInicial || record.valorContrato || 0),
    status: record.status
  }));
  const statuses = [...new Set(sourceProjects.map(item => item.status))].sort((a, b) => {
    if (/andamento/i.test(a)) return -1;
    if (/andamento/i.test(b)) return 1;
    return a.localeCompare(b);
  });
  const progressByStatus = Object.fromEntries(statuses.map(status => [status, /andamento/i.test(status) ? 50 : 25]));
  const query = (STATE.kanbanSearch || '').trim().toLowerCase();
  const activeProjects = sourceProjects.filter(item => {
    return !query || [item.id, item.name, item.category, item.buyer, item.supplier].join(' ').toLowerCase().includes(query);
  });
  const categories = [...new Set(activeProjects.map(item => item.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  const buyers = [...new Set(activeProjects.map(item => item.buyer).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  const categoryFilter = STATE.projectCategory || 'all';
  const buyerFilter = STATE.projectBuyer || 'all';
  const filteredProjects = activeProjects.filter(item =>
    (categoryFilter === 'all' || item.category === categoryFilter) &&
    (buyerFilter === 'all' || item.buyer === buyerFilter)

function renderWeights(){

  const labels = {financeiro:'Impacto financeiro', dependencia:'Dependência', substituibilidade:'Substitutibilidade', risco:'Risco operacional/contratual', performance:'Performance', concentracao:'Concentração'};

function updateWeight(key, val){
  STATE.weights[key] = +val;

  renderRiskTable();

function renderRiskTable(){
  const wrap = document.getElementById('riskTableWrap');
  if(!wrap) return;
  const sorted = [...SUPPLIERS].sort((a,b)=>b.score-a.score);
  wrap.innerHTML = `<table><thead><tr><th>Fornecedor</th><th>Classificação</th><th>Score</th><th>Nível</th></tr></thead>
  <tbody>${sorted.map(s=>{ const r = riskLevel(s.score);
    return `<tr class="clickable" onclick="go('fornecedores','${s.id}')"><td style="font-weight:600;">${s.name}</td>
    <td><span class="badge ${classColor(s.status)}">${s.status}</span></td><td class="num">${s.score}</td>

}

        <div class="panel-sub">Indicadores de qualidade e cobertura da base</div>
        <div class="config-list">
          <div class="config-row"><span class="config-label">Categorias identificadas</span><strong class="config-value num">${categories}</strong></div>
          <div class="config-row"><span class="config-label">Fornecedores identificados</span><strong class="config-value num">${suppliers}</strong></div>
          <div class="config-row"><span class="config-label">Registros com campos incompletos</span><strong class="config-value num" style="color:${incomplete ? 'var(--warning)' : 'var(--success)'};">${incomplete}</strong></div>
          <div class="config-row"><span class="config-label">Matriz de risco</span><button class="config-action" type="button" onclick="go('riscos')">${icon('target')} Abrir matriz Kraljic</button></div>
        </div>
      </section>
    </div>`;
  hydrateIcons();
}

function renderKanban(c){
  setHeader('Compras em andamento', 'Kanban executivo do ciclo de compras');
  const statuses = [
    'Nova solicitação',
    'Em cotação',
    'Em negociação',
    'Aguardando aprovação',
    'Pedido / Contratação',
    'Concluído',
    'Cancelado'
  ];
  const priorityClass = { Alta: 'high', Média: 'medium', Baixa: 'low' };
  const row = STATE.kanban.filter(item => {
    if (!STATE.kanbanSearch) return true;
    const q = STATE.kanbanSearch.toLowerCase();
    return [item.name, item.category, item.buyer, item.supplier].join(' ').toLowerCase().includes(q);
  });

  c.innerHTML = `
    <div class="card panel" style="margin-bottom:14px;">
      <div class="kanban-toolbar">
        <div class="filter-field kanban-search" style="margin:0;">
          <label for="kanbanSearch">Pesquisa</label>
          <input id="kanbanSearch" class="select" type="text" placeholder="Buscar compra, categoria, fornecedor..." value="${STATE.kanbanSearch}" oninput="STATE.kanbanSearch=this.value; render();" />
        </div>
        <button class="select" type="button" onclick="document.getElementById('kanbanForm').scrollIntoView({behavior:'smooth', block:'start'});">+ Nova compra</button>
      </div>
      <div id="kanbanForm" class="kanban-form">
        <div class="field"><label>Nome / descrição</label><input id="kanbanName" type="text" placeholder="Ex.: Contratação de software" /></div>
        <div class="field"><label>Categoria</label><select id="kanbanCategory"><option>Tecnologia</option><option>Facilities</option><option>Marketing</option><option>RH</option><option>Viagens</option><option>Serviços</option></select></div>
        <div class="field"><label>Comprador</label><select id="kanbanBuyer">
          <option>João Silva</option><option>Maria Costa</option><option>Pedro Lima</option><option>Ana Paula</option><option>Carlos Mendes</option><option>Patricia Nunes</option>
        </select></div>
        <div class="field"><label>Fornecedor</label><input id="kanbanSupplier" type="text" placeholder="Fornecedor" /></div>
        <div class="field"><label>Valor estimado</label><input id="kanbanValue" type="number" min="0" step="1000" placeholder="150000" /></div>
        <div class="field"><label>Prazo</label><input id="kanbanDue" type="date" /></div>
        <div class="field"><label>Prioridade</label><select id="kanbanPriority"><option>Alta</option><option selected>Média</option><option>Baixa</option></select></div>
        <div class="field"><label>Status</label><select id="kanbanStatus"><option>Nova solicitação</option><option>Em cotação</option><option>Em negociação</option><option>Aguardando aprovação</option><option>Pedido / Contratação</option><option>Concluído</option><option>Cancelado</option></select></div>
        <div class="field" style="grid-column:1 / -1;"><label>Observações</label><textarea id="kanbanNotes" placeholder="Detalhes do processo..."></textarea></div>
        <div class="kanban-actions">
          <button class="icon-btn" type="button" onclick="resetKanbanForm()">Limpar</button>
          <button class="select" type="button" onclick="addKanbanPurchase()">Salvar compra</button>
        </div>
      </div>
    </div>
    <div class="kanban-board">
      ${statuses.map(status => {
        const laneItems = row.filter(item => item.status === status);
        return `<div class="kanban-lane" data-status="${status}">
          <div class="kanban-header">
            <div class="kanban-title">${status}</div>
            <div class="kanban-count">${laneItems.length}</div>
          </div>
          <div class="kanban-dropzone" ondragover="event.preventDefault()" ondrop="dropKanbanCard('${status}', event)">
            ${laneItems.map(item => `
              <article class="kanban-card" draggable="true" data-id="${item.id}" ondragstart="dragKanbanCard('${item.id}', event)">
                <div class="kanban-card-header">
                  <span class="kanban-code">${item.id}</span>
                  <span class="kanban-priority ${priorityClass[item.priority] || 'medium'}">${item.priority}</span>
                </div>
                <div class="kanban-name">${item.name}</div>
                <div class="kanban-meta">
                  <div class="kanban-meta-row"><span>Categoria</span><strong>${item.category}</strong></div>
                  <div class="kanban-meta-row"><span>Comprador</span><strong>${item.buyer}</strong></div>
                  <div class="kanban-meta-row"><span>Fornecedor</span><strong>${item.supplier}</strong></div>
                  <div class="kanban-meta-row"><span>Valor</span><strong class="num">${fmtMoney(item.value)}</strong></div>
                  <div class="kanban-meta-row"><span>Prazo</span><strong>${item.dueDate ? fmtDate(item.dueDate) : '--'}</strong></div>
                </div>
                ${item.dueDate && new Date(item.dueDate) < new Date() && item.status !== 'Concluído' && item.status !== 'Cancelado' ? '<div class="kanban-alert">⏰ Em atraso</div>' : ''}
              </article>
            `).join('') || '<div class="small-muted">Sem itens nesta etapa.</div>'}
          </div>
        </div>`;
      }).join('')}
    </div>
  `;
  hydrateIcons();
}

function addKanbanPurchase(){
  const name = document.getElementById('kanbanName')?.value?.trim();
  if (!name) return;
  const entry = {
    id: `KAN-${String(Date.now()).slice(-6)}`,
    name,
    category: document.getElementById('kanbanCategory')?.value || 'Tecnologia',
    buyer: document.getElementById('kanbanBuyer')?.value || 'João Silva',
    supplier: document.getElementById('kanbanSupplier')?.value?.trim() || 'Fornecedor indefinido',
    value: Number(document.getElementById('kanbanValue')?.value || 0),
    priority: document.getElementById('kanbanPriority')?.value || 'Média',
    status: document.getElementById('kanbanStatus')?.value || 'Nova solicitação',
    dueDate: document.getElementById('kanbanDue')?.value || '',
    notes: document.getElementById('kanbanNotes')?.value?.trim() || '',
    createdAt: new Date().toISOString()
  };
  STATE.kanban.unshift(entry);
  localStorage.setItem('procurement_kanban', JSON.stringify(STATE.kanban));
  resetKanbanForm();
  render();
}

function resetKanbanForm(){
  const fields = ['kanbanName','kanbanCategory','kanbanBuyer','kanbanSupplier','kanbanValue','kanbanDue','kanbanPriority','kanbanStatus','kanbanNotes'];
  fields.forEach(field => {
    const el = document.getElementById(field);
    if (!el) return;
    if (el.tagName === 'SELECT') el.selectedIndex = 0;
    else el.value = '';
  });
  const statusSelect = document.getElementById('kanbanStatus');
  if (statusSelect) statusSelect.value = 'Nova solicitação';
  const prioritySelect = document.getElementById('kanbanPriority');
  if (prioritySelect) prioritySelect.value = 'Média';
}

function dragKanbanCard(id, event){
  event.dataTransfer?.setData('text/plain', id);
}

function dropKanbanCard(status, event){
  event.preventDefault();
  const id = event.dataTransfer?.getData('text/plain');
  if (!id) return;
  const item = STATE.kanban.find(task => task.id === id);
  if (!item) return;
  item.status = status;
  localStorage.setItem('procurement_kanban', JSON.stringify(STATE.kanban));
  render();
}

function renderSoon(c, page){
  const titles = {relatorios:'Relatórios', config:'Configurações'};
  setHeader(titles[page], 'Módulo em construção');
  c.innerHTML = emptyState(`${titles[page]} entra na próxima fase do roadmap — hoje a prioridade é consolidar o MVP (Dashboard, Fornecedores, Contratos, Savings, Performance).`);
}
function emptyState(text){
  return `<div class="card"><div class="empty-state"><div class="e-ico">${icon('circle-dashed')}</div><div>${text}</div></div></div>`;
}

/* ============================================================
   INIT
   ============================================================ */
render();
applyPortalLogo();
loadData();
window.setInterval(() => {
  loadData({ manual: false });
}, DATA_SOURCE_CONFIG.refreshIntervalMs);
</script>
